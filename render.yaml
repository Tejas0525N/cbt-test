services:
  - type: web
    name: mariner-mastery
    env: node
    plan: free
    runtime: node
    nodeVersion: 22.0.0
    buildCommand: npm ci && npm run build && cd server && npm ci --omit=dev
    startCommand: cd server && node server-json.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true
    branch: main
    healthCheckPath: /
    healthCheckTimeout: 30
